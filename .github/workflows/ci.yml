name: CI

# Standing health gate for Network-Monitor. Runs on every push and PR.
# ubuntu-latest ships gcc, so the RACE DETECTOR runs here (it can't on the
# cgo-less Windows dev box) — this is where `go test -race` lives.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build / vet / test-race / lint / vuln
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # THE race gate. This app has collectors, tickers, background sweeps and
      # shared session state; data races are a real usability class and this is
      # the only place they can be detected (needs cgo).
      - name: go test -race
        run: go test -race ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # Custom class-detection gates (scripts/checks/*.sh) — the SAME extension
      # point scripts/check.sh runs locally, wired here so every current and
      # future class gate (e.g. the discarded-GORM-error analyzer) is enforced
      # on CI too, not just on a developer's machine. Kept as a dedicated step
      # (rather than `bash scripts/check.sh`) so it does not re-run the
      # build/vet/test/lint steps above.
      - name: custom class gates
        run: |
          shopt -s nullglob
          gates=(scripts/checks/*.sh)
          if [ ${#gates[@]} -eq 0 ]; then
            echo "no custom gates present"; exit 0
          fi
          for gate in "${gates[@]}"; do
            echo "== $gate =="
            bash "$gate"
          done

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
