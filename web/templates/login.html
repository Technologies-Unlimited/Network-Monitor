<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 2rem;
            background: #1a1a2e;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            color: #00d4ff;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #888;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ccc;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #333;
            border-radius: 4px;
            background: #0f0f1a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .form-group input::placeholder {
            color: #666;
        }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: #00d4ff;
            color: #0f0f1a;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #00b8e6;
        }

        .btn-login:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .error-message {
            background: #ff4444;
            color: white;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message {
            background: #00cc66;
            color: white;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #333;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin: 0 0.5rem;
        }

        .step.active {
            background: #00d4ff;
            color: #0f0f1a;
        }

        .step.completed {
            background: #00cc66;
            color: white;
        }

        .step-line {
            width: 40px;
            height: 2px;
            background: #333;
            align-self: center;
        }

        #step-1, #step-2 {
            display: none;
        }

        #step-1.active, #step-2.active {
            display: block;
        }

        .mfa-info {
            background: #0f0f1a;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            border: 1px solid #333;
        }

        .mfa-info p {
            margin: 0;
            color: #888;
            font-size: 0.9rem;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #0f0f1a;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Network Monitor</h1>
            <p>Sign in with your ThothOS account</p>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step-indicator-1">1</div>
            <div class="step-line"></div>
            <div class="step" id="step-indicator-2">2</div>
        </div>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <!-- Step 1: Email & Phone -->
        <div id="step-1" class="active">
            <form id="login-form">
                <div class="form-group">
                    <label for="thothos-url">ThothOS URL</label>
                    <input type="url" id="thothos-url" name="thothosUrl"
                           placeholder="https://your-thothos-instance.com"
                           value="http://localhost:3000" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phoneNumber"
                           placeholder="1234567890" required>
                </div>

                <button type="submit" class="btn-login" id="login-btn">
                    Continue
                </button>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #333; text-align: center;">
                <p style="color: #666; font-size: 0.85rem; margin-bottom: 1rem;">Or run without ThothOS integration</p>
                <button type="button" class="btn-login" id="standalone-btn" style="background: #333; color: #ccc;">
                    Use Standalone Mode
                </button>
            </div>
        </div>

        <!-- Step 2: MFA Code -->
        <div id="step-2">
            <div class="mfa-info">
                <p>Enter the 6-digit code from your authenticator app (Google Authenticator, Authy, etc.)</p>
            </div>

            <form id="mfa-form">
                <div class="form-group">
                    <label for="mfa-code">MFA Code</label>
                    <input type="text" id="mfa-code" name="code"
                           placeholder="000000" maxlength="6"
                           pattern="[0-9]{6}" required
                           style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem;">
                </div>

                <button type="submit" class="btn-login" id="verify-btn">
                    Verify & Connect
                </button>
            </form>
        </div>
    </div>

    <script>
        // State management
        let loginState = {
            thothosUrl: '',
            userId: '',
            userType: '',
            companyId: '',
            administrationCompanyId: '',
            // Short-lived step-2 challenge minted by ThothOS at step 1.
            mfaChallengeToken: ''
        };
        let waitTimer = null;

        // DOM elements
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const stepIndicator1 = document.getElementById('step-indicator-1');
        const stepIndicator2 = document.getElementById('step-indicator-2');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const loginForm = document.getElementById('login-form');
        const mfaForm = document.getElementById('mfa-form');
        const loginBtn = document.getElementById('login-btn');
        const verifyBtn = document.getElementById('verify-btn');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        function goToStep2() {
            step1.classList.remove('active');
            step2.classList.add('active');
            stepIndicator1.classList.remove('active');
            stepIndicator1.classList.add('completed');
            stepIndicator2.classList.add('active');
            document.getElementById('mfa-code').focus();
        }

        // Back to step 1 (challenge missing or expired). The old token and the
        // typed code are discarded; the form fields keep their values.
        function goToStep1() {
            loginState.userId = '';
            loginState.userType = '';
            loginState.companyId = '';
            loginState.administrationCompanyId = '';
            loginState.mfaChallengeToken = '';
            document.getElementById('mfa-code').value = '';
            step2.classList.remove('active');
            step1.classList.add('active');
            stepIndicator2.classList.remove('active');
            stepIndicator1.classList.remove('completed');
            stepIndicator1.classList.add('active');
            setLoading(loginBtn, false);
        }

        // 423: the authenticator is locked and waiting never lifts it. Final.
        function lockVerification(message) {
            if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
            showError(message || 'This authenticator is locked. Contact support or recover your account with another verification method.');
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Locked';
            document.getElementById('mfa-code').disabled = true;
        }

        // 429: honour Retry-After by holding the button until the wait is over.
        function holdVerification(seconds) {
            if (waitTimer) { clearInterval(waitTimer); }
            let remaining = seconds;
            const render = () => {
                showError('Too many incorrect codes. Try again in ' + remaining + 's.');
                verifyBtn.textContent = 'Wait ' + remaining + 's';
            };
            verifyBtn.disabled = true;
            render();
            waitTimer = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(waitTimer);
                    waitTimer = null;
                    hideMessages();
                    setLoading(verifyBtn, false);
                    return;
                }
                render();
            }, 1000);
        }

        function setLoading(button, loading) {
            if (loading) {
                button.disabled = true;
                button.innerHTML = '<span class="loading"></span>Please wait...';
            } else {
                button.disabled = false;
                button.textContent = button.id === 'login-btn' ? 'Continue' : 'Verify & Connect';
            }
        }

        // Step 1: Email & Phone
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            setLoading(loginBtn, true);

            const formData = new FormData(loginForm);
            loginState.thothosUrl = formData.get('thothosUrl');

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        thothosUrl: formData.get('thothosUrl'),
                        email: formData.get('email'),
                        phoneNumber: formData.get('phoneNumber')
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    const wait = parseInt(response.headers.get('Retry-After'), 10);
                    showError((data.error || 'Login failed') +
                        (response.status === 429 && wait > 0 ? ' Try again in ' + wait + 's.' : ''));
                    setLoading(loginBtn, false);
                    return;
                }

                // Store state for step 2
                loginState.mfaChallengeToken = data.mfaChallengeToken || '';
                loginState.userId = data.userId;
                loginState.userType = data.userType;
                loginState.companyId = data.companyId || '';
                loginState.administrationCompanyId = data.administrationCompanyId || '';

                // Move to step 2
                goToStep2();
                setLoading(loginBtn, false);

            } catch (err) {
                showError('Failed to connect. Please check your ThothOS URL.');
                setLoading(loginBtn, false);
            }
        });

        // Step 2: MFA Verification
        mfaForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            setLoading(verifyBtn, true);

            const code = document.getElementById('mfa-code').value;

            try {
                const response = await fetch('/api/v1/auth/verify-mfa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        thothosUrl: loginState.thothosUrl,
                        userId: loginState.userId,
                        userType: loginState.userType,
                        code: code,
                        companyId: loginState.companyId,
                        administrationCompanyId: loginState.administrationCompanyId,
                        mfaChallengeToken: loginState.mfaChallengeToken
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    if (data.restartLogin) {
                        // 401, challenge missing/expired: no code was checked.
                        goToStep1();
                        showError('Your sign-in step expired before the code was checked. Enter your email and phone number again.');
                        return;
                    }
                    if (data.locked) {
                        // 423: final.
                        lockVerification(data.error);
                        return;
                    }
                    if (data.retryAfterSeconds > 0) {
                        // 429 (or a wrong code that tripped a lockout): wait.
                        holdVerification(data.retryAfterSeconds);
                        return;
                    }
                    showError(data.error || 'Verification failed');
                    setLoading(verifyBtn, false);
                    return;
                }

                // Success! Redirect to dashboard
                showSuccess('Authentication successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);

            } catch (err) {
                showError('Verification failed. Please try again.');
                setLoading(verifyBtn, false);
            }
        });

        // Auto-format MFA code input
        document.getElementById('mfa-code').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
        });

        // Standalone mode button
        document.getElementById('standalone-btn').addEventListener('click', async () => {
            const standaloneBtn = document.getElementById('standalone-btn');
            hideMessages();
            standaloneBtn.disabled = true;
            standaloneBtn.innerHTML = '<span class="loading"></span>Enabling...';

            try {
                const response = await fetch('/api/v1/auth/standalone', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (!data.success) {
                    showError(data.error || 'Failed to enable standalone mode');
                    standaloneBtn.disabled = false;
                    standaloneBtn.textContent = 'Use Standalone Mode';
                    return;
                }

                showSuccess('Standalone mode enabled! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);

            } catch (err) {
                showError('Failed to enable standalone mode');
                standaloneBtn.disabled = false;
                standaloneBtn.textContent = 'Use Standalone Mode';
            }
        });
    </script>
</body>
</html>
